<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MindMeld AI</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body>

  <!-- AURORA BACKGROUND -->
  <div class="aurora aurora1" aria-hidden="true"></div>
  <div class="aurora aurora2" aria-hidden="true"></div>
  <div class="aurora aurora3" aria-hidden="true"></div>

  <div class="container">

    <!-- HEADER -->
    <header class="header">

      <div class="left">

        <div class="logoBox" aria-label="MindMeld AI Logo">
          <i class="fa-solid fa-spa"></i>
        </div>

        <div>
          <div class="title">MindMeld AI</div>
          <div class="subtitle">
            Your Smart Emotional Companion
          </div>
        </div>

      </div>

      <div class="right">

        <button id="themeToggle" class="iconBtn" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>

        <button id="refreshChat" class="iconBtn" aria-label="Refresh Chat">
          <i class="fa-solid fa-rotate-right"></i>
        </button>

      </div>

    </header>

    <!-- CHAT AREA -->
    <main id="chatBox">

      <div id="emptyState">
        <h2>MindMeld AI</h2>

        <p>
          Your Intelligent Safe Space.<br>
          Talk freely, Share thoughts, Feel heard.
        </p>
      </div>

    </main>

    <!-- INPUT -->
    <footer class="inputArea">

      <button id="attachBtn" class="inputIcon" aria-label="Attach File">
        <i class="fa-solid fa-paperclip"></i>
      </button>

      <input
        type="text"
        id="userInput"
        placeholder="Share your feelings..."
        autocomplete="off"
      />

      <button id="sendBtn" aria-label="Send Message">
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </footer>

    <input type="file" id="fileInput" hidden />

  </div>

  <script src="script.js"></script>

  <!-- UX IMPROVEMENT SCRIPT (SAFE ADD-ON) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");

      if (!input || !sendBtn) return;

      function updateButtonState() {
        const hasText = input.value.trim().length > 0;

        sendBtn.disabled = !hasText;
        sendBtn.style.opacity = hasText ? "1" : "0.5";
        sendBtn.style.cursor = hasText ? "pointer" : "not-allowed";
      }

      // initial state
      updateButtonState();

      input.addEventListener("input", updateButtonState);
    });
  </script>

</body>
</html>
